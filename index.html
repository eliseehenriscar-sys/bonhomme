<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Bonhomme Shooter - 2 Joueurs</title>
  <style>
    body { margin:0; padding:0; display:flex; justify-content:center; align-items:center; height:100vh; background:#111; overflow:hidden; }
    canvas { border:4px solid #ffcc00; }
    #ui { position:absolute; top:15px; left:15px; color:white; font-family:Arial; font-size:20px; text-shadow:2px 2px 4px black; }
    #highscore { position:absolute; top:15px; right:15px; color:#ffdd00; font-family:Arial; font-size:16px; text-shadow:2px 2px 4px black; text-align:right; line-height:1.5; }
    #gamepadInfo { position:absolute; bottom:10px; left:10px; color:#aaa; font-family:Arial; font-size:14px; }
    #clearScores { position:absolute; bottom:10px; right:10px; background:#222; color:#ff6666; border:1px solid #ff6666; padding:6px 12px; cursor:pointer; font-family:Arial; font-size:13px; }
    #clearScores:hover { background:#ff6666; color:white; }
    .score-line { display:flex; justify-content:flex-end; align-items:center; gap:8px; margin:2px 0; }
    .del-btn {
      background:#aa2222; color:white; border:none; border-radius:4px;
      width:22px; height:22px; font-size:14px; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      padding:0; line-height:1;
    }
    .del-btn:hover { background:#ff3333; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="1200" height="600"></canvas>
  <div id="ui">
    J1 <span id="name1">Bleu</span>: <span id="score1">0</span> &nbsp; ❤ <span id="lives1">5</span> &nbsp;&nbsp;&nbsp;
    J2 <span id="name2">Vert</span>: <span id="score2">0</span> &nbsp; ❤ <span id="lives2">5</span> &nbsp;&nbsp;&nbsp;
    Vague: <span id="wave">1</span>
  </div>
  <div id="highscore">
    <div style="font-size:18px; margin-bottom:4px;">🏆 TOP 4 RECORDS</div>
    <div id="highScoreList"></div>
  </div>
  <div id="gamepadInfo">Manettes connectées : <span id="gamepadStatus">0</span></div>
  <button id="clearScores">Effacer tous les scores</button>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const player1Name = prompt("Entrez le nom du Joueur 1 (Bleu) :", "Joueur Bleu") || "Joueur Bleu";
    const player2Name = prompt("Entrez le nom du Joueur 2 (Vert) :", "Joueur Vert") || "Joueur Vert";
    const player1 = { x:200, y:420, speed:7, color:"#00aaff", score:0, vy:0, onGround:true, lives:5, alive:true, name: player1Name, crouching: false };
    const player2 = { x:800, y:420, speed:7, color:"#00ff88", score:0, vy:0, onGround:true, lives:5, alive:true, name: player2Name, crouching: false };
    let bullets=[], enemyBullets=[], enemies=[], warTanks=[], smokes=[];
    let wave=1, frameCount=0;
    let boss=null;
    let bossSpawnedThisWave=false;

    // === DÉCORS VOLANTS ===
    let clouds = [];
    let birds = [];
    let planes = [];

    for (let i = 0; i < 6; i++) {
      clouds.push({
        x: Math.random() * 1400 - 100,
        y: 40 + Math.random() * 160,
        speed: 0.3 + Math.random() * 0.5,
        size: 0.7 + Math.random() * 0.6
      });
    }

    // === TOP 4 RECORDS (avec suppression individuelle) ===
    let highScores = [];
    function loadHighScores() {
      const saved = localStorage.getItem("bonhommeShooterTop4");
      if (saved) {
        highScores = JSON.parse(saved);
      }
      updateHighScoreDisplay();
    }
    function saveHighScores() {
      localStorage.setItem("bonhommeShooterTop4", JSON.stringify(highScores));
    }
    function updateHighScoreDisplay() {
      const list = document.getElementById("highScoreList");
      if (highScores.length === 0) {
        list.innerHTML = "<div style='color:#aaa'>Aucun record</div>";
        return;
      }
      list.innerHTML = highScores.map((s, i) => 
        `<div class="score-line">
          <span>${i+1}. ${s.name} — ${s.score}</span>
          <button class="del-btn" onclick="removeHighScore(${i})" title="Supprimer ce record">✕</button>
        </div>`
      ).join("");
    }
    function addHighScore(name, score) {
      highScores.push({ name, score });
      highScores.sort((a, b) => b.score - a.score);
      highScores = highScores.slice(0, 4);
      saveHighScores();
      updateHighScoreDisplay();
    }
    function removeHighScore(index) {
      if (index >= 0 && index < highScores.length) {
        highScores.splice(index, 1);
        saveHighScores();
        updateHighScoreDisplay();
      }
    }
    function clearAllScores() {
      if (confirm("Tu es sûr de vouloir effacer TOUS les records ?")) {
        highScores = [];
        saveHighScores();
        updateHighScoreDisplay();
      }
    }
    // Rendre la fonction accessible depuis le HTML (onclick)
    window.removeHighScore = removeHighScore;

    document.getElementById("clearScores").addEventListener("click", clearAllScores);
    loadHighScores();

    const keys={};
    const GRAVITY=0.8, JUMP_FORCE=-18;
    const audioCtx=new (window.AudioContext||window.webkitAudioContext)();

    // ==================== SUPPORT MANETTES ====================
    let gamepads = [];
    function updateGamepadStatus() {
      const connected = gamepads.filter(gp => gp !== null).length;
      document.getElementById("gamepadStatus").textContent = connected;
    }
    window.addEventListener("gamepadconnected", (e) => {
      gamepads[e.gamepad.index] = e.gamepad;
      updateGamepadStatus();
    });
    window.addEventListener("gamepaddisconnected", (e) => {
      gamepads[e.gamepad.index] = null;
      updateGamepadStatus();
    });

    function getGamepad(playerIndex) {
      return gamepads[playerIndex] || null;
    }

    function handleGamepadInput() {
      gamepads = navigator.getGamepads ? Array.from(navigator.getGamepads()) : [];
      const gp1 = getGamepad(0);
      if (gp1 && player1.alive) {
        const leftStickX = gp1.axes[0];
        const leftStickY = gp1.axes[1];
        if (Math.abs(leftStickX) > 0.2) player1.x += player1.speed * leftStickX * 1.1;
        if (leftStickY < -0.3 && player1.onGround) {
          player1.vy = JUMP_FORCE;
          player1.onGround = false;
        }
        player1.crouching = leftStickY > 0.4 && player1.onGround;
        if (gp1.buttons[0].pressed || gp1.buttons[7].pressed) {
          if (!gp1.shootCooldown1 || gp1.shootCooldown1 <= 0) {
            shoot(player1);
            playRealisticShootSound();
            gp1.shootCooldown1 = 12;
          }
        }
        if (gp1.shootCooldown1) gp1.shootCooldown1--;
      }
      const gp2 = getGamepad(1);
      if (gp2 && player2.alive) {
        const leftStickX = gp2.axes[0];
        const leftStickY = gp2.axes[1];
        if (Math.abs(leftStickX) > 0.2) player2.x += player2.speed * leftStickX * 1.1;
        if (leftStickY < -0.3 && player2.onGround) {
          player2.vy = JUMP_FORCE;
          player2.onGround = false;
        }
        player2.crouching = leftStickY > 0.4 && player2.onGround;
        if (gp2.buttons[0].pressed || gp2.buttons[7].pressed) {
          if (!gp2.shootCooldown2 || gp2.shootCooldown2 <= 0) {
            shoot(player2);
            playRealisticShootSound();
            gp2.shootCooldown2 = 12;
          }
        }
        if (gp2.shootCooldown2) gp2.shootCooldown2--;
      }
    }

    // ==================== TIR CLAVIER ====================
    let player1ShootCooldown = 0;
    let player2ShootCooldown = 0;
    function handleKeyboardShooting() {
      if (keys['r'] && player1.alive && player1ShootCooldown <= 0) {
        shoot(player1);
        playRealisticShootSound();
        player1ShootCooldown = 8;
      }
      if (player1ShootCooldown > 0) player1ShootCooldown--;
      if (keys['l'] && player2.alive && player2ShootCooldown <= 0) {
        shoot(player2);
        playRealisticShootSound();
        player2ShootCooldown = 8;
      }
      if (player2ShootCooldown > 0) player2ShootCooldown--;
    }

    // ========== SONS ==========
    function playRealisticShootSound() {
      const bufferSize = audioCtx.sampleRate * 0.11;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2.8);
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = "bandpass";
      filter.frequency.value = 2200;
      filter.Q.value = 1.5;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

      const osc = audioCtx.createOscillator();
      osc.type = "square";
      osc.frequency.setValueAtTime(1100, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 0.035);
      const oscGain = audioCtx.createGain();
      oscGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

      noise.connect(filter).connect(gain).connect(audioCtx.destination);
      osc.connect(oscGain).connect(audioCtx.destination);
      noise.start();
      osc.start();
      osc.stop(audioCtx.currentTime + 0.05);
    }

    function playBossShootSound() {
      const bufferSize = audioCtx.sampleRate * 0.4;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 1.6);
      }
      const noise = audioCtx.createBufferSource();
      noise.buffer = buffer;

      const lowpass = audioCtx.createBiquadFilter();
      lowpass.type = "lowpass";
      lowpass.frequency.value = 220;

      const gain = audioCtx.createGain();
      gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

      const osc = audioCtx.createOscillator();
      osc.type = "sine";
      osc.frequency.setValueAtTime(80, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(28, audioCtx.currentTime + 0.4);
      const oscGain = audioCtx.createGain();
      oscGain.gain.setValueAtTime(0.85, audioCtx.currentTime);
      oscGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.45);

      noise.connect(lowpass).connect(gain).connect(audioCtx.destination);
      osc.connect(oscGain).connect(audioCtx.destination);
      noise.start();
      osc.start();
      osc.stop(audioCtx.currentTime + 0.45);
    }

    function playHitSound(){
      const noise=audioCtx.createBufferSource();
      const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*0.1,audioCtx.sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<buffer.length;i++) data[i]=Math.random()*2-1;
      noise.buffer=buffer;
      const filter=audioCtx.createBiquadFilter(); filter.type='highpass'; filter.frequency.value=800;
      const gain=audioCtx.createGain();
      gain.gain.setValueAtTime(0.4,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.2);
      noise.connect(filter).connect(gain).connect(audioCtx.destination); noise.start();
    }
    function playExplosionSound(){
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type='triangle'; osc.frequency.setValueAtTime(180,audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60,audioCtx.currentTime+0.4);
      gain.gain.setValueAtTime(0.6,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.45);
      osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.45);
    }
    function playBossHitSound(){
      const osc=audioCtx.createOscillator(),gain=audioCtx.createGain();
      osc.type='square'; osc.frequency.setValueAtTime(300,audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100,audioCtx.currentTime+0.3);
      gain.gain.setValueAtTime(0.5,audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.3);
      osc.connect(gain).connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime+0.3);
    }

    function playBulletBlockSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.08);
      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    document.getElementById("name1").textContent = player1.name;
    document.getElementById("name2").textContent = player2.name;

    function hitPlayer(player, uiId){
      if(!player.alive) return;
      player.lives--;
      document.getElementById(uiId).textContent=player.lives;
      playHitSound();
      if(player.lives<=0){ player.alive=false; if(!player1.alive&&!player2.alive) gameOver(); }
    }

    function isBossWave(w){ return w>=2 && w%2===0; }
    function spawnBoss(){
      const bossLives=8+Math.floor((wave-2)/2)*3;
      boss={
        x:1200, y:390, width:60, height:80,
        speed:2+wave*0.3,
        lives:bossLives, maxLives:bossLives,
        shootTimer:60,
        phase:0,
        vy:0, onGround:true,
        color:"#ff6600", eyeAnim:0
      };
      bossSpawnedThisWave=true;
    }

    // ========== DESSIN DES DÉCORS ==========
    function drawCloud(c) {
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(c.x, c.y, 28 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 25 * c.size, c.y - 10 * c.size, 22 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 50 * c.size, c.y, 26 * c.size, 0, Math.PI * 2);
      ctx.arc(c.x + 25 * c.size, c.y + 8 * c.size, 20 * c.size, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBird(b) {
      ctx.save();
      ctx.translate(b.x, b.y);
      if (b.dir === -1) ctx.scale(-1, 1);

      const wingFlap = Math.sin(b.wing) * 14;

      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.ellipse(0, 0, 12, 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(11, -2, 5.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(13, -3, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(13.5, -3, 0.9, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#e67e22";
      ctx.beginPath();
      ctx.moveTo(16, -2);
      ctx.lineTo(24, -1);
      ctx.lineTo(16, 1.5);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#222";
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.quadraticCurveTo(-8, -18 + wingFlap, -22, -8 + wingFlap * 0.7);
      ctx.quadraticCurveTo(-16, -4 + wingFlap * 0.4, -6, 0);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#333";
      ctx.lineWidth = 1.2;
      for (let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.moveTo(-4 - i * 3, -3);
        ctx.quadraticCurveTo(-10 - i * 3, -14 + wingFlap * 0.6, -18 - i * 2, -6 + wingFlap * 0.5);
        ctx.stroke();
      }

      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.quadraticCurveTo(-8, 16 - wingFlap, -20, 7 - wingFlap * 0.6);
      ctx.quadraticCurveTo(-14, 4 - wingFlap * 0.3, -5, 1);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.moveTo(-10, 0);
      ctx.lineTo(-20, -6);
      ctx.lineTo(-18, 0);
      ctx.lineTo(-20, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function drawPlane(p) {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.dir === -1) ctx.scale(-1, 1);

      ctx.fillStyle = "#ddd";
      ctx.beginPath();
      ctx.ellipse(0, 0, 28, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#88ccff";
      ctx.beginPath();
      ctx.ellipse(8, -3, 10, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#bbb";
      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(-25, -18);
      ctx.lineTo(5, -18);
      ctx.lineTo(15, 0);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-5, 0);
      ctx.lineTo(-20, 14);
      ctx.lineTo(5, 14);
      ctx.lineTo(12, 0);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#999";
      ctx.beginPath();
      ctx.moveTo(-22, 0);
      ctx.lineTo(-32, -12);
      ctx.lineTo(-28, 0);
      ctx.lineTo(-32, 10);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#444";
      ctx.fillRect(26, -3, 6, 6);
      ctx.beginPath();
      ctx.arc(29, 0, 8, 0, Math.PI * 2);
      ctx.strokeStyle = "#666";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#2266aa";
      for (let i = 0; i < 4; i++) {
        ctx.fillRect(-8 + i * 6, -2, 3, 3);
      }

      ctx.restore();
    }

    function updateDecorations() {
      clouds.forEach(c => {
        c.x -= c.speed;
        if (c.x < -120) {
          c.x = 1300 + Math.random() * 100;
          c.y = 40 + Math.random() * 160;
          c.size = 0.7 + Math.random() * 0.6;
        }
      });

      if (Math.random() < 0.008) {
        birds.push({
          x: 1250,
          y: 60 + Math.random() * 180,
          speed: 2.2 + Math.random() * 1.8,
          dir: -1,
          wing: Math.random() * Math.PI * 2
        });
      }
      for (let i = birds.length - 1; i >= 0; i--) {
        birds[i].x -= birds[i].speed;
        birds[i].wing += 0.28;
        if (birds[i].x < -40) birds.splice(i, 1);
      }

      if (Math.random() < 0.0025) {
        const fromLeft = Math.random() < 0.5;
        planes.push({
          x: fromLeft ? -80 : 1280,
          y: 50 + Math.random() * 140,
          speed: 3.5 + Math.random() * 2.5,
          dir: fromLeft ? 1 : -1
        });
      }
      for (let i = planes.length - 1; i >= 0; i--) {
        planes[i].x += planes[i].speed * planes[i].dir;
        if (planes[i].x < -100 || planes[i].x > 1400) planes.splice(i, 1);
      }
    }

    function drawBackground(){
      const gradient=ctx.createLinearGradient(0,0,0,400);
      gradient.addColorStop(0,"#0a1f4d"); gradient.addColorStop(1,"#1e5a9e");
      ctx.fillStyle=gradient; ctx.fillRect(0,0,canvas.width,600);

      ctx.fillStyle="#ffdd00"; ctx.beginPath(); ctx.arc(280,110,48,0,Math.PI*2); ctx.fill();
      ctx.fillStyle="#ffaa00"; ctx.beginPath(); ctx.arc(280,110,36,0,Math.PI*2); ctx.fill();

      ctx.fillStyle="#ffffff";
      [[80,50],[620,35],[1050,80],[420,120],[880,45]].forEach(s=>{
        ctx.beginPath(); ctx.arc(s[0],s[1],2.8,0,Math.PI*2); ctx.fill();
      });

      clouds.forEach(drawCloud);
      birds.forEach(drawBird);
      planes.forEach(drawPlane);

      ctx.fillStyle="#1e2a1e";
      ctx.beginPath(); ctx.moveTo(0,450); ctx.lineTo(180,280); ctx.lineTo(420,450); ctx.fill();
      ctx.beginPath(); ctx.moveTo(300,450); ctx.lineTo(580,220); ctx.lineTo(850,450); ctx.fill();
      ctx.beginPath(); ctx.moveTo(750,450); ctx.lineTo(980,260); ctx.lineTo(1250,450); ctx.fill();

      ctx.fillStyle="#1e5a1e";
      ctx.fillRect(0,445,canvas.width,20);
      ctx.fillStyle="#333333";
      ctx.fillRect(0,465,canvas.width,80);
      ctx.fillStyle="#555555";
      ctx.fillRect(0,465,canvas.width,8);
      ctx.fillRect(0,532,canvas.width,8);
      ctx.strokeStyle = "#ffdd00";
      ctx.lineWidth = 6;
      for(let x = 0; x < canvas.width; x += 80){
        ctx.beginPath();
        ctx.setLineDash([25, 35]);
        ctx.moveTo(x, 500);
        ctx.lineTo(x + 35, 500);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.fillStyle="#3a2f1e";
      ctx.fillRect(0,545,canvas.width,55);
    }

    function drawWarTank(x,y){
      ctx.fillStyle="#222"; ctx.fillRect(x+2,y+28,38,11);
      ctx.fillStyle="#111"; ctx.fillRect(x+5,y+30,32,7);
      ctx.fillStyle="#2a8f2a"; ctx.strokeStyle="#1e5c1e"; ctx.lineWidth=3;
      ctx.fillRect(x+5,y+15,35,20); ctx.strokeRect(x+5,y+15,35,20);
      ctx.fillStyle="#256b25"; ctx.fillRect(x+12,y+10,22,13); ctx.strokeRect(x+12,y+10,22,13);
      ctx.strokeStyle="#1e1e1e"; ctx.lineWidth=6;
      ctx.beginPath(); ctx.moveTo(x+33,y+16); ctx.lineTo(x+50,y+16); ctx.stroke();
      ctx.fillStyle="#1e1e1e"; ctx.beginPath(); ctx.arc(x+23,y+16,5,0,Math.PI*2); ctx.fill();
    }

    function drawMachineGun(x, y, facingRight = true) {
      ctx.save();
      if (!facingRight) {
        ctx.translate(x, y);
        ctx.scale(-1, 1);
        x = 0; y = 0;
      }
      ctx.fillStyle = "#2a2a2a";
      ctx.fillRect(x + 18, y + 18, 28, 8);
      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(x + 46, y + 19, 22, 5);
      ctx.fillStyle = "#111";
      ctx.fillRect(x + 66, y + 20, 5, 3);
      ctx.fillStyle = "#333";
      ctx.fillRect(x + 28, y + 26, 8, 12);
      ctx.fillStyle = "#222";
      ctx.fillRect(x + 20, y + 26, 6, 10);
      ctx.fillStyle = "#444";
      ctx.fillRect(x + 22, y + 16, 12, 3);
      ctx.restore();
    }

    function drawHuman(x, y, color, name, facingRight = true, crouching = false) {
      ctx.save();

      const crouchOffset = crouching ? 12 : 0;
      const bodyHeight = crouching ? 16 : 24;

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x + 6, y + 18 + crouchOffset, 18, bodyHeight, 4);
      ctx.fill();

      ctx.fillStyle = "#f5cba7";
      ctx.beginPath();
      ctx.arc(x + 15, y + 10 + crouchOffset, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#3d2314";
      ctx.beginPath();
      ctx.arc(x + 15, y + 6 + crouchOffset, 11, Math.PI * 1.1, Math.PI * 1.9);
      ctx.fill();
      ctx.fillRect(x + 5, y + 2 + crouchOffset, 20, 6);

      ctx.strokeStyle = "#2c1810";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 9, y + 6 + crouchOffset);
      ctx.lineTo(x + 13, y + 5 + crouchOffset);
      ctx.moveTo(x + 17, y + 5 + crouchOffset);
      ctx.lineTo(x + 21, y + 6 + crouchOffset);
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.ellipse(x + 11, y + 9 + crouchOffset, 3, 2.2, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 19, y + 9 + crouchOffset, 3, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.arc(x + 11.5, y + 9 + crouchOffset, 1.4, 0, Math.PI * 2);
      ctx.arc(x + 19.5, y + 9 + crouchOffset, 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#d4a574";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + 15, y + 10 + crouchOffset);
      ctx.lineTo(x + 15, y + 13 + crouchOffset);
      ctx.lineTo(x + 16.5, y + 13.5 + crouchOffset);
      ctx.stroke();

      ctx.strokeStyle = "#a0522d";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x + 15, y + 15 + crouchOffset, 3, 0.1, Math.PI - 0.1);
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 22 + crouchOffset);
      ctx.lineTo(x + 0, y + 32 + crouchOffset);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 22, y + 22 + crouchOffset);
      ctx.lineTo(x + 32, y + 26 + crouchOffset);
      ctx.stroke();

      drawMachineGun(x, y + crouchOffset, facingRight);

      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 6;
      if (crouching) {
        ctx.beginPath();
        ctx.moveTo(x + 11, y + 34 + crouchOffset);
        ctx.lineTo(x + 6, y + 42 + crouchOffset);
        ctx.moveTo(x + 19, y + 34 + crouchOffset);
        ctx.lineTo(x + 24, y + 42 + crouchOffset);
        ctx.stroke();
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(x + 2, y + 40 + crouchOffset, 8, 5);
        ctx.fillRect(x + 20, y + 40 + crouchOffset, 8, 5);
      } else {
        ctx.beginPath();
        ctx.moveTo(x + 11, y + 42);
        ctx.lineTo(x + 8, y + 55);
        ctx.moveTo(x + 19, y + 42);
        ctx.lineTo(x + 22, y + 55);
        ctx.stroke();
        ctx.fillStyle = "#1a1a1a";
        ctx.fillRect(x + 4, y + 53, 8, 5);
        ctx.fillRect(x + 18, y + 53, 8, 5);
      }

      ctx.fillStyle = "white";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center";
      ctx.fillText(name, x + 15, y - 6 + crouchOffset);
      ctx.textAlign = "left";

      ctx.restore();
    }

    function drawEnemyHuman(x, y, color, name) {
      ctx.save();

      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.roundRect(x + 6, y + 18, 18, 24, 4);
      ctx.fill();

      ctx.fillStyle = "#f5cba7";
      ctx.beginPath();
      ctx.arc(x + 15, y + 10, 11, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.arc(x + 15, y + 6, 11, Math.PI * 1.1, Math.PI * 1.9);
      ctx.fill();
      ctx.fillRect(x + 5, y + 2, 20, 6);

      ctx.strokeStyle = "#2c1810";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(x + 9, y + 6);
      ctx.lineTo(x + 13, y + 5);
      ctx.moveTo(x + 17, y + 5);
      ctx.lineTo(x + 21, y + 6);
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.ellipse(x + 11, y + 9, 3, 2.2, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 19, y + 9, 3, 2.2, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.arc(x + 10.5, y + 9, 1.4, 0, Math.PI * 2);
      ctx.arc(x + 18.5, y + 9, 1.4, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#d4a574";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x + 15, y + 10);
      ctx.lineTo(x + 15, y + 13);
      ctx.lineTo(x + 13.5, y + 13.5);
      ctx.stroke();

      ctx.strokeStyle = "#a0522d";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(x + 15, y + 15, 3, 0.1, Math.PI - 0.1);
      ctx.stroke();

      ctx.strokeStyle = color;
      ctx.lineWidth = 5;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x + 22, y + 22);
      ctx.lineTo(x + 30, y + 32);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 8, y + 22);
      ctx.lineTo(x - 2, y + 26);
      ctx.stroke();

      drawMachineGun(x + 15, y, false);

      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.moveTo(x + 11, y + 42);
      ctx.lineTo(x + 8, y + 55);
      ctx.moveTo(x + 19, y + 42);
      ctx.lineTo(x + 22, y + 55);
      ctx.stroke();

      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(x + 4, y + 53, 8, 5);
      ctx.fillRect(x + 18, y + 53, 8, 5);

      ctx.fillStyle = "white";
      ctx.font = "bold 15px Arial";
      ctx.textAlign = "center";
      ctx.fillText(name, x + 15, y - 6);
      ctx.textAlign = "left";

      ctx.restore();
    }

    function drawDeadHuman(x, y, color, name) {
      ctx.globalAlpha = 0.45;
      drawHuman(x, y, color, name);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#ff0000";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(x + 2, y + 2);
      ctx.lineTo(x + 28, y + 52);
      ctx.moveTo(x + 28, y + 2);
      ctx.lineTo(x + 2, y + 52);
      ctx.stroke();
    }

    function drawBoss(b) {
      const x = b.x, y = b.y;
      b.eyeAnim = (b.eyeAnim + 0.12) % (Math.PI * 2);

      ctx.fillStyle = b.color;
      ctx.beginPath();
      ctx.roundRect(x + 12, y + 28, 36, 36, 6);
      ctx.fill();

      ctx.fillStyle = "#e8b88a";
      ctx.beginPath();
      ctx.arc(x + 30, y + 16, 16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#1a1a1a";
      ctx.beginPath();
      ctx.arc(x + 30, y + 10, 16, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();

      const eyeGlow = Math.sin(b.eyeAnim) * 0.5 + 0.5;

      ctx.strokeStyle = "#2c1810";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x + 20, y + 10);
      ctx.lineTo(x + 27, y + 8);
      ctx.moveTo(x + 33, y + 8);
      ctx.lineTo(x + 40, y + 10);
      ctx.stroke();

      ctx.fillStyle = `rgb(255, ${Math.floor(80 + eyeGlow * 100)}, 0)`;
      ctx.beginPath();
      ctx.ellipse(x + 24, y + 15, 4, 3, 0, 0, Math.PI * 2);
      ctx.ellipse(x + 36, y + 15, 4, 3, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#000";
      ctx.beginPath();
      ctx.arc(x + 24, y + 15, 1.8, 0, Math.PI * 2);
      ctx.arc(x + 36, y + 15, 1.8, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#8b0000";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + 30, y + 22, 5, 0.2, Math.PI - 0.2);
      ctx.stroke();

      ctx.strokeStyle = b.color;
      ctx.lineWidth = 8;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(x + 15, y + 35);
      ctx.lineTo(x - 5, y + 40);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x + 45, y + 35);
      ctx.lineTo(x + 60, y + 42);
      ctx.stroke();

      ctx.fillStyle = "#1a1a1a";
      ctx.fillRect(x - 30, y + 34, 48, 13);
      ctx.fillStyle = "#111";
      ctx.fillRect(x - 50, y + 36, 24, 8);
      ctx.fillStyle = "#000";
      ctx.fillRect(x - 56, y + 37, 8, 6);
      ctx.fillStyle = "#333";
      ctx.fillRect(x - 10, y + 47, 14, 18);
      ctx.fillStyle = "#222";
      ctx.fillRect(x + 8, y + 47, 10, 14);

      ctx.strokeStyle = "#2c3e50";
      ctx.lineWidth = 9;
      ctx.beginPath();
      ctx.moveTo(x + 20, y + 64);
      ctx.lineTo(x + 14, y + 82);
      ctx.moveTo(x + 40, y + 64);
      ctx.lineTo(x + 46, y + 82);
      ctx.stroke();

      ctx.fillStyle = "#ffdd00";
      ctx.strokeStyle = "#cc9900";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 16, y - 2);
      ctx.lineTo(x + 16, y - 16);
      ctx.lineTo(x + 24, y - 8);
      ctx.lineTo(x + 30, y - 20);
      ctx.lineTo(x + 36, y - 8);
      ctx.lineTo(x + 44, y - 16);
      ctx.lineTo(x + 44, y - 2);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      const barW = 120, barH = 10;
      const barX = x + 30 - barW/2, barY = y - 32;
      const ratio = b.lives / b.maxLives;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX-1, barY-1, barW+2, barH+2);
      ctx.fillStyle = ratio > 0.5 ? "#ff6600" : ratio > 0.25 ? "#ffaa00" : "#ff0000";
      ctx.fillRect(barX, barY, barW * ratio, barH);
      ctx.strokeStyle = "#ffdd00";
      ctx.lineWidth = 1.5;
      ctx.strokeRect(barX-1, barY-1, barW+2, barH+2);
      ctx.fillStyle = "#fff";
      ctx.font = "bold 12px Arial";
      ctx.textAlign = "center";
      ctx.fillText("★ " + b.lives + " / " + b.maxLives, x+30, barY-4);
      ctx.textAlign = "left";
    }

    function updateBoss(){
      if(!boss) return;
      const b = boss;
      if(b.phase === 0){ b.x -= b.speed; if(b.x < 500) b.phase = 1; }
      else { b.x += b.speed * 0.5; if(b.x > 900) b.phase = 0; }
      if(b.onGround && Math.random() < 0.008){ b.vy = JUMP_FORCE * 0.9; b.onGround = false; }
      b.vy += GRAVITY; b.y += b.vy;
      if(b.y >= 390){ b.y = 390; b.vy = 0; b.onGround = true; }
      b.shootTimer--;
      if(b.shootTimer <= 0){
        [player1, player2].forEach(target => {
          if(!target.alive) return;
          const dx = (target.x + 15) - (b.x - 50), dy = (target.y + 25) - (b.y + 40);
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          const spd = 6 + wave * 0.4;
          enemyBullets.push({x: b.x - 50, y: b.y + 40, vx: (dx/dist)*spd, vy: (dy/dist)*spd, isBoss: true});
        });
        b.shootTimer = Math.max(30, 70 - wave * 5);
        playBossShootSound();
      }
      [player1, player2].forEach((p, idx) => {
        if(!p.alive) return;
        const hitH = p.crouching ? 40 : 55;
        if(b.x < p.x + 30 && b.x + 60 > p.x && b.y < p.y + hitH && b.y + 80 > p.y)
          hitPlayer(p, idx === 0 ? "lives1" : "lives2");
      });
      for(let j = bullets.length - 1; j >= 0; j--){
        const bl = bullets[j];
        if(bl.x > b.x && bl.x < b.x + 60 && bl.y > b.y && bl.y < b.y + 80){
          b.lives--;
          bullets.splice(j, 1);
          playBossHitSound();
          if(b.lives <= 0){
            const bonus = 150 + wave * 30;
            player1.score += bonus; player2.score += bonus;
            document.getElementById("score1").textContent = player1.score;
            document.getElementById("score2").textContent = player2.score;
            playExplosionSound();
            boss = null;
          }
          break;
        }
      }
      if(boss) drawBoss(boss);
    }

    window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
    window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);
    canvas.addEventListener("click", () => { if(player1.alive){ shoot(player1); playRealisticShootSound(); }});
    canvas.addEventListener("contextmenu", e => { e.preventDefault(); if(player2.alive){ shoot(player2); playRealisticShootSound(); }});

    function shoot(player){
      const shootY = player.crouching ? player.y + 34 : player.y + 22;
      bullets.push({x: player.x + 55, y: shootY, vx: 16, vy: 0, radius: 6, owner: player === player1 ? 1 : 2});
    }

    function updatePlayer(player, leftKey, rightKey, jumpKey, crouchKey){
      if(!player.alive) return;
      if(keys[leftKey]) player.x -= player.speed;
      if(keys[rightKey]) player.x += player.speed;
      if(keys[jumpKey] && player.onGround && !player.crouching){ 
        player.vy = JUMP_FORCE; 
        player.onGround = false; 
      }
      player.crouching = keys[crouchKey] && player.onGround;

      player.vy += GRAVITY; 
      player.y += player.vy;
      if(player.y >= 420){ 
        player.y = 420; 
        player.vy = 0; 
        player.onGround = true; 
      }
      player.x = Math.max(50, Math.min(1050, player.x));
    }

    function gameLoop(){
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      updateDecorations();
      drawBackground();
      handleGamepadInput();
      handleKeyboardShooting();
      updatePlayer(player1, "arrowleft", "arrowright", "arrowup", "arrowdown");
      updatePlayer(player2, "a", "d", "w", "s");
      frameCount++;

      if(frameCount % (60 * 10) === 0){
        wave++;
        document.getElementById("wave").textContent = wave;
        bossSpawnedThisWave = false;
      }

      if(isBossWave(wave) && !bossSpawnedThisWave && !boss) spawnBoss();

      if(warTanks.length === 0){
        warTanks.push({x:0, y:0, shootTimer:0, ownerIdx:0});
        warTanks.push({x:0, y:0, shootTimer:0, ownerIdx:1});
      }
      warTanks.forEach(tank => {
        const owner = tank.ownerIdx === 0 ? player1 : player2;
        if(!owner.alive) return;
        tank.x = owner.x + 48; 
        tank.y = owner.y + (owner.crouching ? 20 : 8); 
        tank.shootTimer--;
        if(tank.shootTimer <= 0 && enemies.length > 0){
          for(let enemy of enemies){
            if(enemy.x > tank.x){
              const dx = enemy.x + 15 - (tank.x + 48), dy = enemy.y + 20 - (tank.y + 14);
              const dist = Math.sqrt(dx*dx + dy*dy) || 1;
              bullets.push({x: tank.x + 48, y: tank.y + 14, vx: (dx/dist)*13, vy: (dy/dist)*13, radius:5, owner:3});
              for(let i = 0; i < 8; i++)
                smokes.push({x: tank.x + 52, y: tank.y + 14, vx: -1.5 + Math.random()*3, vy: -2 - Math.random()*2, life:35 + Math.random()*20, size:6 + Math.random()*8});
              tank.shootTimer = 45; playRealisticShootSound(); break;
            }
          }
        }
        drawWarTank(tank.x, tank.y);
      });

      for(let i = smokes.length - 1; i >= 0; i--){
        let s = smokes[i];
        s.x += s.vx; s.y += s.vy; s.vy -= 0.1; s.life--; s.size *= 0.98;
        if(s.life <= 0){ smokes.splice(i, 1); continue; }
        ctx.globalAlpha = s.life / 40; ctx.fillStyle = "#555";
        ctx.beginPath(); ctx.arc(s.x, s.y, s.size, 0, Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha = 1;

      if(player1.alive) drawHuman(player1.x, player1.y, player1.color, player1.name, true, player1.crouching);
      else drawDeadHuman(player1.x, player1.y, player1.color, player1.name);
     
      if(player2.alive) drawHuman(player2.x, player2.y, player2.color, player2.name, true, player2.crouching);
      else drawDeadHuman(player2.x, player2.y, player2.color, player2.name);

      updateBoss();

      // Ennemis réduits
      if(Math.random() < 0.009 + wave * 0.003){
        enemies.push({x:1200, y:420, speed:4.3 + wave*0.7, shootTimer: Math.max(25, 65 - wave*4)});
      }

      for(let i = enemies.length - 1; i >= 0; i--){
        let e = enemies[i];
        e.x -= e.speed; e.shootTimer--;
        drawEnemyHuman(e.x, e.y, "#ff4444", "Ennemi");
        if(e.shootTimer <= 0){
          let target = null;
          if(player1.alive && player2.alive) target = player1.x < player2.x ? player1 : player2;
          else if(player1.alive) target = player1;
          else if(player2.alive) target = player2;
          if(target && target.x < e.x){
            const dx = (target.x + 15) - (e.x - 20), dy = (target.y + 25) - (e.y + 22);
            const dist = Math.sqrt(dx*dx + dy*dy) || 1;
            enemyBullets.push({x: e.x - 20, y: e.y + 22, vx: (dx/dist)*(5.5 + wave*0.4), vy: (dy/dist)*(5.5 + wave*0.4)});
            e.shootTimer = Math.max(20, 65 - wave*5);
            playRealisticShootSound();
          }
        }
        let killed = false;
        for(let j = bullets.length - 1; j >= 0; j--){
          let b = bullets[j];
          if(b.x > e.x && b.x < e.x + 30 && b.y > e.y && b.y < e.y + 55){
            enemies.splice(i, 1); bullets.splice(j, 1); playExplosionSound();
            if(b.owner === 1) player1.score += 20;
            else if(b.owner === 2) player2.score += 20;
            else player1.score += 15;
            document.getElementById("score1").textContent = player1.score;
            document.getElementById("score2").textContent = player2.score;
            killed = true; break;
          }
        }
        if(killed) continue;
        let removed = false;
        for(let pi = 0; pi < 2; pi++){
          const p = pi === 0 ? player1 : player2;
          const uiId = pi === 0 ? "lives1" : "lives2";
          if(!p.alive) continue;
          const hitH = p.crouching ? 40 : 55;
          if(e.x < p.x + 30 && e.x + 30 > p.x && e.y < p.y + hitH && e.y + 55 > p.y){
            hitPlayer(p, uiId);
            if(!removed){ enemies.splice(i, 1); removed = true; }
          }
        }
      }

      // Collision balles joueurs vs balles ennemies
      for (let i = bullets.length - 1; i >= 0; i--) {
        const pb = bullets[i];
        for (let j = enemyBullets.length - 1; j >= 0; j--) {
          const eb = enemyBullets[j];
          const dx = pb.x - eb.x;
          const dy = pb.y - eb.y;
          const dist = Math.sqrt(dx * dx + dy * dy);
          if (dist < (pb.radius + (eb.isBoss ? 7 : 5))) {
            bullets.splice(i, 1);
            enemyBullets.splice(j, 1);
            playBulletBlockSound();
            for (let k = 0; k < 5; k++) {
              smokes.push({
                x: (pb.x + eb.x) / 2,
                y: (pb.y + eb.y) / 2,
                vx: -2 + Math.random() * 4,
                vy: -2 + Math.random() * 4,
                life: 15 + Math.random() * 10,
                size: 3 + Math.random() * 4
              });
            }
            break;
          }
        }
      }

      for(let i = enemyBullets.length - 1; i >= 0; i--){
        let b = enemyBullets[i];
        b.x += b.vx; b.y += b.vy;
        ctx.fillStyle = b.isBoss ? "#ff6600" : "#ff00ff";
        ctx.beginPath(); ctx.arc(b.x, b.y, b.isBoss ? 7 : 5, 0, Math.PI*2); ctx.fill();
        let hit = false;
        if(player1.alive){
          const hitH = player1.crouching ? 40 : 55;
          if(b.x > player1.x && b.x < player1.x + 30 && b.y > player1.y && b.y < player1.y + hitH){
            hitPlayer(player1, "lives1"); enemyBullets.splice(i, 1); hit = true;
          }
        }
        if(!hit && player2.alive){
          const hitH = player2.crouching ? 40 : 55;
          if(b.x > player2.x && b.x < player2.x + 30 && b.y > player2.y && b.y < player2.y + hitH){
            hitPlayer(player2, "lives2"); enemyBullets.splice(i, 1); hit = true;
          }
        }
        if(!hit && (b.x < 0 || b.x > 1200 || b.y < 0 || b.y > 600)) enemyBullets.splice(i, 1);
      }

      for(let i = bullets.length - 1; i >= 0; i--){
        let b = bullets[i];
        b.x += b.vx; b.y += b.vy || 0;
        ctx.fillStyle = b.owner === 3 ? "#00ffcc" : "#ffff00";
        ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
        if(b.x > 1250) bullets.splice(i, 1);
      }

      if(boss){
        ctx.fillStyle = "rgba(255,100,0,0.08)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ff6600"; ctx.font = "bold 16px Arial"; ctx.textAlign = "center";
        ctx.fillText("⚠ MASTER EN JEU ⚠ ❤ " + boss.lives + " / " + boss.maxLives, canvas.width/2, 580);
        ctx.textAlign = "left";
      }

      requestAnimationFrame(gameLoop);
    }

    function gameOver(){
      if (player1.score > 0) addHighScore(player1.name, player1.score);
      if (player2.score > 0) addHighScore(player2.name, player2.score);

      alert("Game Over !\nVague atteinte : " + wave + "\n\n" +
            player1.name + " (Bleu): " + player1.score + "\n" +
            player2.name + " (Vert): " + player2.score);
      location.reload();
    }

    gameLoop();
  </script>
